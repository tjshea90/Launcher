# On-demand emulator check (manual only; ~10-15 min of Actions minutes, so never on push).
# Boots an Android 10 (API 29) x86 emulator at the tablet's 600x1024, installs the debug APK, makes it the Home app,
# drives the home screen / long-press menu / app drawer, and uploads screenshots to compare with research/uploads/2026-11-02/.
# Later (TASKS P4) it also runs the safety scenarios: forced crashes, mode flips, Restore.
name: Emulator check

on:
  workflow_dispatch:
    inputs:
      sections:
        description: 'Which scenario sections to run, comma list, in the order they run: base,legacy,x1,e1,y2,b6,b4,n,n6,o,t,u,s,p,x,v,g,rs,ka,ac,bs,bl,pa,pt,ad,se,rs2,rt,im,rs3,gc,rs4,pf,rb,last,ao,rg,uf,cs,cs2,an,nq,hp,cu,hf,fp,ss,gear,wf,bt,mu. EMPTY = everything incl. research: do NOT, pick sections with tools/gate.sh (about 42 min since 2026-11-05, close to the 2700 s step limit: do not use it as the gate). RELEASE GATE = two side-by-side runs, about 20 min each: A = base,legacy,x1,e1,y2,b6,b4,n,n6,o,t,u,s,p,x and B = v,g,ka,ac,rt,im,gc,pf,rb,last (the one-off research sections rs to rs4 are not part of it). A new feature usually needs only its own, e.g. "n6" (~5 min).'
        required: false
        default: ''
      shots:
        description: 'true = also push the run''s PNG screenshots to the orphan branch ci-shots (so Claude can look at them; it cannot download artifacts). Default false.'
        required: false
        default: 'false'

permissions:
  contents: read

concurrency:
  # the sections are part of the group, so two section runs can go side by side (the same group would cancel the older one)
  group: emulator-${{ github.ref }}-${{ inputs.sections }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write   # only so the optional shots step can push the orphan branch ci-shots; nothing else writes
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/results   # post step: the compact RESULTS block becomes the last lines of the log
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true       # no cache upload/cleanup chatter (about 100 log lines) after the scenario: results are read from the END of the log
          add-job-summary: never
          cache-cleanup: never
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android SDK packages
        run: |
          SDKM="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" >/dev/null
      - name: ImageMagick (the scenario compares screenshots with it)
        timeout-minutes: 6   # run 543 (2026-11-11): this step failed after 2 minutes on an apt error and ended the whole run before the scenario: skip the install when the runner image has it, else retry quickly
        run: |
          APT='sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20'
          if ! command -v convert >/dev/null 2>&1; then
            for i in 1 2 3; do
              $APT update >/dev/null 2>&1 || true
              if $APT install -y --no-install-recommends imagemagick > "$RUNNER_TEMP/apt.log" 2>&1; then break; fi
              echo "imagemagick install, attempt $i failed:"; tail -5 "$RUNNER_TEMP/apt.log"; sleep 5
            done
          fi
          command -v convert
      - name: ffmpeg (only for sections pt, hf and fp, which film the power menu opening and measure the patch frame by frame)
        if: contains(format(',{0},', inputs.sections), ',pt,') || contains(format(',{0},', inputs.sections), ',hf,') || contains(format(',{0},', inputs.sections), ',fp,')
        timeout-minutes: 4   # run 248: the package mirror stalled for 6 minutes; retry quickly instead of waiting
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends ffmpeg >/dev/null
      - name: Build the debug APK
        run: ./gradlew :app:assembleDebug :phoneguide:assembleDebug :testnotifier:assembleDebug --console=plain
      - name: Build the music app and its upstream CONTROL (Eleven; only for section mu, TASKS BV1e)
        if: contains(format(',{0},', inputs.sections), ',mu,')
        run: |
          set -e
          # 1. The CONTROL (MU-2): upstream's own Eleven WITH its album-art code = eleven/src/main of the pinned baseline commit (UPSTREAM.md) + the one port fix (CHANGES.md 1) + this repo's build file.
          #    The scenario plays the same song through the same screens and must SEE the cover there; otherwise "no cover in our pictures" would prove nothing. Built first and copied away, the tree is then put back.
          BASE=db65f0240c22f5352ff509d3363b011919621108
          git fetch --depth=1 origin "$BASE"
          git checkout --no-overlay "$BASE" -- eleven/src/main
          sed -i 's/\([ (]\)R\.attr\.actionOverflowMenuStyle/\1androidx.appcompat.R.attr.actionOverflowMenuStyle/' eleven/src/main/java/org/lineageos/eleven/utils/PopupMenuHelper.java
          grep -q 'androidx.appcompat.R.attr.actionOverflowMenuStyle' eleven/src/main/java/org/lineageos/eleven/utils/PopupMenuHelper.java
          ./gradlew :eleven:assembleDebug --console=plain
          cp eleven/build/outputs/apk/debug/eleven-debug.apk eleven/build/eleven-upstream-control.apk
          # 2. Back to the real source (no overlay: files that exist only in the baseline are removed again), then the real build the scenario installs.
          git checkout --no-overlay HEAD -- eleven/src/main
          test -z "$(git status --porcelain eleven)"
          ./gradlew :eleven:assembleDebug --console=plain
      - name: Boot Android 10, run the scenario
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SECTIONS: ${{ inputs.sections }}
        with:
          api-level: 29
          target: default
          arch: x86
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: timeout 2700 bash tools/emulator_scenario.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screenshots
          path: emulator-out/
          retention-days: 14
          if-no-files-found: warn
      - name: Publish the screenshots to branch ci-shots (only when shots=true)
        if: always() && inputs.shots == 'true'
        continue-on-error: true
        timeout-minutes: 3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SECTIONS: ${{ inputs.sections }}
        run: bash tools/ci_publish_shots.sh emulator-out
