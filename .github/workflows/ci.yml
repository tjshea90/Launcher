# Cheap CI: unit tests + lint + the shell self-test. Runs on pull requests and on demand ONLY.
# NEVER add `push:` — autosave pushes after every tool call (see android.yml's header).
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: bash tools/test_handoff.sh
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK packages
        run: |
          SDKM="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" >/dev/null
      - run: ./gradlew testDebugUnitTest :app:lintDebug --console=plain
      - name: Test and lint reports (failed runs only)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports
            app/build/test-results
          retention-days: 7
